<!DOCTYPE html>
<html>
<head>
    <title>Basic map</title>
    <meta name="viewport" content="width=device-width, 
    initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    //viewport controls how items is displayed on computer or tablet for different screen sizes
    <link rel = "stylesheet" href = "leaflet.css">


    <script src="leaflet.js"></script>


    <!-- More content will go here -->
     <style>
        body {
            padding: 0;
            margin: 0;
        }
        html, body, #map {
            height: 100%;
            width: 100%;
        }

     </style>
</head>
<body>
    <!-- More content will go here -->
     <div id = "map"></div>
     <script>
        var map = L.map("map", {center: [41.3147, -105.5690], zoom: 17});
        //Please modify center coordinate if you want to show different area
        
        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", 
            {attribution: '&copy; <a href="http://' + 
            'www.openstreetmap.org/copyright">OpenStreetMap</a>'}
        ).addTo(map);

        //add a point marker in the agriculture building at University of Wyoming


       // add a marker
       var pnt = L.marker([41.3147, -105.5690]).addTo(map);

      
        //add a circlemarker
        L.circleMarker([41.3147, -105.5690], {radius: 20, color: "purple", fillcolor: "lightpurple"}).addTo(map);
        //after class try to add circle.


        //add a line
        var line = L.polyline([
            [41.3147, -105.5690],
            [41.3147, -105.5680],
            [41.3137, -105.5680]
        ], {color: "red", weight: 1}).addTo(map);


        //add polygons
        var polygon = L.polygon([
            [41.3147, -105.5690],
            [41.3147, -105.5680],
            [41.3137, -105.5680]
        ], {color: "blue", fillColor: "lightblue", weight: 2}).addTo(map);
        



     </script>
</body>
</html>
